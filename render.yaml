# =====================================================
# Custo Certo - Configuração do Render
# =====================================================
# Este arquivo permite "Infrastructure as Code" no Render.
# Ao criar um novo Web Service apontando para este repo,
# o Render lê este arquivo e configura tudo automaticamente.
## Documentação: https://render.com/docs/blueprint-spec


services:
  - type: web
    name: custo-certo
    runtime: node
    plan: free
    region: oregon          # mais próximo do Brasil entre as regiões free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: AUTO_SEED
        value: "true"

      # ⚠️  Os dados de conexão do MySQL devem ser preenchidos manualmente no
      # painel do Render por segurança (não comitar senha no repo).
      #
      # No painel: Settings → Environment → Add Environment Variable
      #
      # PENDÊNCIA (decisões D2 e D3, ainda em aberto no grupo): o MySQL da
      # apresentação roda hoje na máquina de um dos integrantes, sem endereço
      # público. Um servidor no Render não alcança esse banco. Antes de reativar
      # este deploy é preciso decidir onde o MySQL vai ficar hospedado.
      - key: DB_HOST
        sync: false           # marca como "secret" — preencher no painel

      - key: DB_PORT
        value: "3306"

      - key: DB_NAME
        value: custo_certo

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false           # opcional: lista de domínios autorizados